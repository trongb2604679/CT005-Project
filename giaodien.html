<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Game Collection</title>
  <link rel="stylesheet" href="dohoa.css">
</head>
<body>

  <!-- Canvas Pháo hoa (Fixed Overlay) -->
  <canvas id="fxCanvas"></canvas>

  <!-- Modal Bảng Kết Thúc -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h3 class="modal-title" id="modalTitle">🎉 CHIẾN THẮNG!</h3>
      <div class="modal-body" id="modalBody">Thống kê...</div>
      <button class="start-btn" onclick="closeModalAndRestart()">Chơi tiếp 🔄</button>
    </div>
  </div>

  <!-- Thanh chọn game (SPA Navigation) -->
  <div class="game-selector">
    <button class="nav-btn active" data-game="memory" onclick="switchGame('memory')">🎴 Lật Thẻ Bài</button>
    <button class="nav-btn" data-game="cake" onclick="switchGame('cake')">🎂 Xếp Bánh Kem</button>
    <button class="nav-btn" data-game="flappy" onclick="switchGame('flappy')">🐤 Flappy Bird</button>
  </div>

  <!-- Thanh tiêu đề -->
  <div class="game-bar">
    <h2 id="gameTitle">🎴 Lật Thẻ Bài</h2>
  </div>

  <!-- Thanh chọn chủ đề riêng cho Lật thẻ bài -->
  <div class="theme-selector" id="themeSelector">
    <button class="theme-btn active" onclick="changeMemoryTheme(0)">🐶 Động vật</button>
    <button class="theme-btn" onclick="changeMemoryTheme(1)">🍎 Thức ăn</button>
    <button class="theme-btn" onclick="changeMemoryTheme(2)">🚗 Phương tiện</button>
    <button class="theme-btn" onclick="changeMemoryTheme(3)">⚽ Thể thao</button>
  </div>

  <!-- Dashboard trạng thái & Thông báo -->
  <div class="status-dashboard" id="dashboard"></div>
  <div id="previewMessage" class="preview-msg"></div>

  <!-- Khung chứa các game -->
  <div class="game-container">
    <!-- Game 1: Lật thẻ bài -->
    <div class="memory-wrapper" id="memoryWrapper">
      <div class="start-overlay" id="memoryOverlay">
        <h3>🎴 LẬT THẺ BÀI</h3>
        <button class="start-btn" onclick="startMemoryGameFromOverlay()">BẮT ĐẦU CHƠI 🚀</button>
      </div>
      <div class="memory-board" id="memoryBoard"></div>
    </div>
    
    <!-- Game 2 & 3: Canvas chung -->
    <div class="canvas-wrapper" id="canvasWrapper">
      <div class="start-overlay" id="startOverlay">
        <h3 id="overlayTitle">Sẵn Sàng Bắt Đầu?</h3>
        <button class="start-btn" onclick="pressStartButton()">BẮT ĐẦU CHƠI 🚀</button>
      </div>
      <canvas id="mainCanvas" class="game-canvas" width="400" height="400"></canvas>
    </div>
  </div>

  <script src="tuongtac.js"></script>
</body>
</html>
